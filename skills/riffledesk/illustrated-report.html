<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>圖解導覽｜技能交付</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.85}a{color:inherit;text-underline-offset:5px}button,input{font:inherit}button,a,input{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ed8b39;outline-offset:4px}p{overflow-wrap:anywhere}h1,h2,h3{line-height:1.4}h1{font-weight:600;letter-spacing:-.04em}h2{margin-top:2.3em}nav.top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;letter-spacing:.08em;padding:22px 5vw;border-bottom:1px solid #8884}.tag{font-size:11px;letter-spacing:.15em;text-transform:uppercase}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}td,th{padding:14px 16px;border-bottom:1px solid #8884;min-width:110px}th{font-weight:600}blockquote{margin:30px 0;padding:20px 25px;border-left:3px solid currentColor}footer{padding:28px 0;font-size:12px;opacity:.7}.tasks{padding:0;list-style:none}.tasks li{padding:8px 0}ol{padding-left:24px}article{min-width:0}button{cursor:pointer}svg{max-width:100%;height:auto}small{font-size:12px}details{margin-top:22px;border-top:1px solid #8884;padding-top:12px}summary{cursor:pointer}@media(max-width:600px){h1{font-size:30px!important}main{padding-left:22px!important;padding-right:22px!important}td,th{padding:12px 10px}nav.top{padding:17px 22px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media print{nav,.controls,button{display:none!important}body{background:white!important;color:black!important}main{max-width:none!important}}body{background:#faf8f1;color:#302c32}main{max-width:1100px;margin:auto;padding:45px 60px}h1{font-family:"PMingLiU",serif;font-size:50px;margin:14px 0}.intro{max-width:650px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:32px 0}.steps button{border:1px solid #b7a7a2;background:transparent;padding:20px;text-align:left;color:inherit}.steps button[aria-pressed=true]{background:#824b42;color:#fff9ed;border-color:#824b42}.num{font-family:Georgia,serif;font-size:32px;display:block}.stage{display:grid;grid-template-columns:1.2fr 1fr;gap:45px;background:#eee8db;padding:35px}.stage h2{margin-top:0}.stage svg{width:100%}.caption{color:#785750}.step-note{font-size:13px}.flow{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:35px 0}.flow span{border-bottom:2px solid #ad7963;padding:9px}.callout{border-left:3px solid #a8684f;padding:15px 22px;margin-top:30px}@media(max-width:700px){.stage{grid-template-columns:1fr;padding:22px}.steps button{padding:12px}.steps{gap:7px}.num{font-size:23px}main{padding:30px}}</style></head><body><nav class="top"><a href="spatial-report.html">看看空間圖解範例</a><span>圖解文件範例・圖解導覽</span></nav><main><div class="tag caption">02 / A guided explanation</div><h1 data-rd-id="title">一份原稿，<br>如何走到你的眼前？</h1><p class="intro">agent 把流程拆成三個可點選的步驟。每一步都配一張圖，適合解釋原理、教人操作，而不是把長文塞成一張海報。</p><div class="steps controls" role="group" aria-label="選擇流程步驟"><button data-step="0" aria-pressed="true"><span class="num">01</span>照常交付</button><button data-step="1" aria-pressed="false"><span class="num">02</span>整理呈現</button><button data-step="2" aria-pressed="false"><span class="num">03</span>打開閱讀</button></div><section class="stage" aria-live="polite"><div id="diagram"></div><div><div class="tag caption" id="stepLabel">STEP 01</div><h2 id="stepTitle"></h2><p id="stepText"></p><p class="step-note" id="stepNote"></p></div></section><div class="flow"><span>原始內容</span>→<span>閱讀版型／互動作品</span>→<span>RiffleDesk</span></div><aside class="callout" data-rd-id="takeaway">圖解應該幫你理解，而不是取代必要的文字。這些示意圖由程式畫出，不需要額外呼叫生圖服務。</aside><footer>適用：操作教學、系統原理、流程說明。這是技能交付的樣本；尚未安裝自動產生技能。</footer><noscript>流程是：agent 交付內容 → 套版或製作互動作品 → 翻閱桌呈現。執行網頁程式後可逐步查看圖解。</noscript></main><script>
const steps=[['照常寫完內容','原本的 agent 不必知道閱讀版型存在，照常留下 Markdown、表格和圖片。','自動套版路線不會改寫內容。'],['讓結構變得清楚','翻閱桌辨識標題、表格和清單，使用固定版型。agent 可依需要製作圖解與互動，不必另外安裝技能。','兩種路線的差別，在於是否新增內容與互動。'],['把作品送到閱讀區','原始檔留在本機，翻閱桌打開對應頁面；需要操作的內容，可以直接在閱讀區使用。','目前互動頁需啟用「執行網頁程式」。']];
const diagrams=[`<rect x="80" y="25" width="180" height="220" rx="4" fill="#fffaf0" stroke="#824b42" stroke-width="2"/><path d="M110 65h100M110 92h120M110 118h90M110 160h120M110 184h105M110 208h115" stroke="#b69b84" stroke-width="7"/><text x="170" y="280" text-anchor="middle" fill="#824b42" font-size="17">原稿保持原樣</text>`,`<rect x="22" y="50" width="100" height="180" fill="#fffaf0" stroke="#824b42"/><path d="M140 140h45m-12-12 12 12-12 12" stroke="#824b42" fill="none" stroke-width="3"/><rect x="205" y="50" width="115" height="180" fill="#fffaf0" stroke="#824b42"/><rect x="218" y="65" width="89" height="42" fill="#b97861"/><path d="M220 128h80M220 150h80M220 172h80M220 194h60" stroke="#bcab94" stroke-width="6"/>`,`<rect x="20" y="45" width="300" height="190" rx="8" fill="#fffaf0" stroke="#824b42" stroke-width="2"/><path d="M20 75h300" stroke="#824b42"/><circle cx="38" cy="60" r="4" fill="#b97861"/><rect x="35" y="90" width="70" height="125" fill="#ddd4c2"/><rect x="118" y="90" width="185" height="38" fill="#b97861"/><path d="M125 152h165M125 174h155M125 196h130" stroke="#bcab94" stroke-width="7"/>`];
function pick(i){document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.step===i));stepLabel.textContent='STEP 0'+(i+1);stepTitle.textContent=steps[i][0];stepText.textContent=steps[i][1];stepNote.textContent=steps[i][2];diagram.innerHTML='<svg viewBox="0 0 340 300" role="img" aria-label="'+steps[i][0]+'示意圖">'+diagrams[i]+'</svg>'}document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>pick(+b.dataset.step));pick(0);
</script></body></html>

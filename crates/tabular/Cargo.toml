[package]
name = "tabular"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "把試算表與分隔符文字檔讀成可序列化的 Table"
license = "MIT"

[dependencies]
calamine = { version = "0.37.0", features = ["dates"] }
chardetng = "1.0.0"
csv = "1.4.0"
encoding_rs = "0.8.42"
encoding_rs_io = "0.1.8"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
rust_xlsxwriter = "0.102.0"
serde_json = "1.0.154"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
